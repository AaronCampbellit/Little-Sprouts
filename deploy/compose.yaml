name: little-sprouts
services:
  web:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    container_name: little-sprouts-web
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.50
    ports:
      - "${SPROUTS_BIND_ADDRESS:-127.0.0.1}:${SPROUTS_PORT:-8080}:8080"
    volumes:
      - "${SPROUTS_SITE_DIR:-../dist}:/srv:ro"
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data:uid=1000,gid=1000,mode=0700
      - /config:uid=1000,gid=1000,mode=0700
      - /tmp:uid=1000,gid=1000,mode=0700
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
